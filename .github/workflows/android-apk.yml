name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'COSPLAYCHESS-main/mobile/**'
      - 'COSPLAYCHESS-main/index.html'
      - 'COSPLAYCHESS-main/style.css'
      - 'COSPLAYCHESS-main/**/*.js'
      - 'COSPLAYCHESS-main/assets/**'
      - 'COSPLAYCHESS-main/img/**'
      - '.github/workflows/android-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: COSPLAYCHESS-main/mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install mobile dependencies
        run: npm install

      - name: Prepare game bundle
        run: npm run prepare:web

      - name: Create Android project
        run: npx cap add android

      - name: Sync Android project
        run: npx cap sync android

      - name: Apply Cosplay Chess launcher icon
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          ICON_SRC="../img/favicon/favicon-96x96.png"
          test -f "$ICON_SRC"
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          for spec in "mdpi:48" "hdpi:72" "xhdpi:96" "xxhdpi:144" "xxxhdpi:192"; do
            density="${spec%%:*}"
            size="${spec##*:}"
            dir="android/app/src/main/res/mipmap-${density}"
            mkdir -p "$dir"
            convert "$ICON_SRC" -resize "${size}x${size}" -background none -gravity center -extent "${size}x${size}" "$dir/ic_launcher.png"
            cp "$dir/ic_launcher.png" "$dir/ic_launcher_round.png"
          done

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ../CosplayChess-Android.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CosplayChess-Android-APK
          path: COSPLAYCHESS-main/CosplayChess-Android.apk
          if-no-files-found: error
          retention-days: 30
