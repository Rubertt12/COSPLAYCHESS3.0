name: Cosplay Chess Bluetooth Test - Windows

on:
  push:
    branches:
      - experimental/bluetooth-remote
    paths:
      - 'COSPLAYCHESS-main/**'
      - '.github/workflows/bluetooth-remote-windows.yml'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: COSPLAYCHESS-main

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: COSPLAYCHESS-main/package-lock.json

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Gerar icone Windows multiresolucao
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pillow
          @'
          from PIL import Image
          src = Image.open(r"img/favicon/web-app-manifest-512x512.png").convert("RGBA")
          src.save(r"img/favicon/cosplay-chess-windows.ico", format="ICO", sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])
          '@ | Set-Content -Encoding UTF8 make_icon.py
          python make_icon.py

      - name: Gerar instalador experimental
        shell: pwsh
        run: npm run dist:win -- --publish never

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Cosplay-Chess-Bluetooth-Test-Windows
          path: |
            COSPLAYCHESS-main/dist/*.exe
            COSPLAYCHESS-main/dist/*.blockmap
          if-no-files-found: error
