name: Bluetooth Remote Android

on:
  push:
    branches:
      - experimental/bluetooth-remote
    paths:
      - 'bluetooth-controller-android/**'
      - '.github/workflows/bluetooth-remote-android.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle -p bluetooth-controller-android :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CosplayChess-Remote-Bluetooth-debug
          path: bluetooth-controller-android/app/build/outputs/apk/debug/app-debug.apk
