name: Unify CosplayChess monorepo

on:
  push:
    branches:
      - agent/unifica-site-jogo
    paths:
      - .github/workflows/unify-monorepo.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/unifica-site-jogo

      - name: Import public site and organize monorepo
        shell: bash
        run: |
          set -euo pipefail

          rm -rf /tmp/cosplay-site apps/site
          git clone --depth 1 https://github.com/Rubertt12/COSPLAYCHESS.git /tmp/cosplay-site

          mkdir -p apps/site

          site_files=(
            index.html
            landing.css
            landing.js
            community.css
            community.js
            config.js
            cadastro.html
            cadastro.js
            admin.html
            admin.css
            admin.js
            admin-emergency-reset.js
            admin-gallery.js
            universo.html
            ranking.html
            hall-da-fama.html
            conquistas.html
            resultados-admin.html
            resultados-admin.css
            resultados-admin.js
            vercel.json
          )

          for item in "${site_files[@]}"; do
            if [[ -e "/tmp/cosplay-site/$item" ]]; then
              cp -a "/tmp/cosplay-site/$item" "apps/site/$item"
            fi
          done

          if [[ -d /tmp/cosplay-site/img ]]; then
            cp -a /tmp/cosplay-site/img apps/site/img
          fi

          if [[ ! -d apps/game ]]; then
            cp -a COSPLAYCHESS-main apps/game
          fi

          cat > apps/site/README.md <<'EOF'
          # CosplayChess — Site público

          Aplicação pública do CosplayChess.

          Inclui landing page, inscrições, painel administrativo, galeria, Universo Fergorverse, Hall da Fama, ranking e conquistas.

          Para publicar na Vercel, use `apps/site` como Root Directory do projeto.
          EOF

          cat > package.json <<'EOF'
          {
            "name": "cosplaychess-monorepo",
            "private": true,
            "version": "3.0.0",
            "scripts": {
              "game:start": "npm --prefix apps/game start",
              "game:build": "npm --prefix apps/game run build",
              "game:dist": "npm --prefix apps/game run dist"
            }
          }
          EOF

          cat > README.md <<'EOF'
          # CosplayChess 3.0

          Plataforma completa do CosplayChess em um único repositório.

          ## Estrutura

          - `apps/site` — landing page, inscrições, administração, galeria, Universo Fergorverse, Hall da Fama, ranking e conquistas.
          - `apps/game` — aplicativo Electron usado para operar o tabuleiro e o espetáculo durante os eventos.
          - `COSPLAYCHESS-main` — cópia legada temporária do app, mantida durante a migração para rollback.

          ## Deploy do site

          Configure o projeto da Vercel para usar `apps/site` como **Root Directory**.

          ## Aplicativo

          ```bash
          npm run game:start
          npm run game:build
          ```

          Depois da validação de Vercel, instalador e atualização automática, a pasta legada poderá ser removida em uma alteração separada.
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps README.md package.json README-MONOREPO.md

          if ! git diff --cached --quiet; then
            git commit -m "Migra site público para estrutura monorepo"
            git push origin HEAD:agent/unifica-site-jogo
          fi

      - name: Validate migrated structure
        shell: bash
        run: |
          test -f apps/site/index.html
          test -f apps/site/admin.html
          test -f apps/site/ranking.html
          test -f apps/site/conquistas.html
          test -f apps/game/package.json
          echo "Monorepo structure validated."
