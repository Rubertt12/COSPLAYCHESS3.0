name: Cosplay Chess - Build e atualização automática

on:
  push:
    branches:
      - main
    paths:
      - "apps/game/**"
      - ".github/workflows/desktop-auto-update.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cosplay-chess-desktop-release
  cancel-in-progress: true

jobs:
  build-and-release:
    name: Gerar instalador e publicar atualização
    runs-on: windows-latest

    defaults:
      run:
        working-directory: apps/game

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/game/package-lock.json

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Incluir recursos adicionais do Windows
        shell: pwsh
        run: |
          $target = "participant-experience.js"
          if (-not (Test-Path $target)) {
            throw "Script principal da Central da partida ausente: $target"
          }

          $extras = @(
            @{ File = "custom-pieces.js"; Label = "Criador de peças extras" },
            @{ File = "piece-name-editor-fix.js"; Label = "Editor de nome" },
            @{ File = "piece-board-placement.js"; Label = "Posicionamento manual de peças" }
          )

          foreach ($extra in $extras) {
            if (-not (Test-Path $extra.File)) {
              throw "Arquivo obrigatório ausente: $($extra.File)"
            }
            Add-Content -Path $target -Value "`r`n"
            Get-Content -Raw $extra.File | Add-Content -Path $target
            Write-Host "$($extra.Label) anexado diretamente a $target."
          }

          $built = Get-Content -Raw $target
          $requiredMarkers = @(
            "__cosplayCustomPiecesInstalled",
            "__cosplayPieceNameEditorFixLoaded",
            "__cosplayPieceBoardPlacementInstalled",
            "EDITAR NOME DA PEÇA",
            "POSICIONAR PEÇA NO TABULEIRO"
          )

          foreach ($marker in $requiredMarkers) {
            if (-not $built.Contains($marker)) {
              throw "Validação do bundle falhou. Marcador ausente: $marker"
            }
          }

          Write-Host "Validação OK: criador de peças, editor de nome e posicionamento no tabuleiro estão no script executado pela Central."

      - name: Gerar versão automática
        shell: pwsh
        run: |
          $version = "1.1.${{ github.run_number }}"
          npm version $version --no-git-tag-version
          "APP_VERSION=$version" >> $env:GITHUB_ENV
          Write-Host "Versão da atualização: $version"

      - name: Compilar e publicar no GitHub Releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist:win -- --publish always

      - name: Resumo
        shell: pwsh
        run: |
          "### Cosplay Chess $env:APP_VERSION" >> $env:GITHUB_STEP_SUMMARY
          "Criador de peças, editor de nome e posicionamento manual incluídos diretamente na Central da partida e validados antes da compilação." >> $env:GITHUB_STEP_SUMMARY
          "Instalador NSIS, versão portátil e metadados de atualização publicados no GitHub Releases." >> $env:GITHUB_STEP_SUMMARY
